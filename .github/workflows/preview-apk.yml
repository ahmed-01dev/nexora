name: NEXORA Preview APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase/android/google-services.json'
      - '.github/workflows/preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --project-name nexora --platforms=android .

      - name: Configure Firebase Android and permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          source = Path("firebase/android/google-services.json")
          target = Path("android/app/google-services.json")
          if source.is_file():
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

              settings = Path("android/settings.gradle.kts")
              app_gradle = Path("android/app/build.gradle.kts")
              plugin_line = '    id("com.google.gms.google-services") version "4.5.0" apply false'
              text = settings.read_text(encoding="utf-8")
              if "com.google.gms.google-services" not in text:
                  match = re.search(r"plugins\\s*\\{", text)
                  if not match:
                      raise SystemExit("Missing Gradle plugins block")
                  text = text[:match.end()] + "\\n" + plugin_line + text[match.end():]
                  settings.write_text(text, encoding="utf-8")

              text = app_gradle.read_text(encoding="utf-8")
              if 'id("com.google.gms.google-services")' not in text:
                  match = re.search(r"plugins\\s*\\{", text)
                  if not match:
                      raise SystemExit("Missing app Gradle plugins block")
                  text = text[:match.end()] + '\\n    id("com.google.gms.google-services")' + text[match.end():]
                  app_gradle.write_text(text, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permissions = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "<application",
                      f'<uses-permission android:name="{permission}" />\\n    <application',
                      1,
                  )
          manifest.write_text(text, encoding="utf-8")

          gradle = Path("android/app/build.gradle.kts")
          if gradle.is_file():
              text = gradle.read_text(encoding="utf-8")
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 26")
              gradle.write_text(text, encoding="utf-8")
          print("Android preview project configured.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build preview APK
        run: flutter build apk --debug --dart-define=SUPABASE_URL=https://wwdeexgkwpftyavbhiff.supabase.co --dart-define=SUPABASE_ANON_KEY=sb_publishable_vJpkaM72QMGLykLFU5m44g_kwuPCi-Y

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-preview-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
