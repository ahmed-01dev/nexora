name: NEXORA Android and Web Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Normalize and validate Supabase connection
        env:
          SUPABASE_URL_INPUT: ${{ secrets.SUPABASE_URL || 'https://wwdeexgkwpftyavbhiff.supabase.co' }}
          SUPABASE_ANON_KEY_INPUT: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_vJpkaM72QMGLykLFU5m44g_kwuPCi-Y' }}
        run: |
          SUPABASE_URL_CLEAN="$(printf '%s' "$SUPABASE_URL_INPUT" | tr -d '[:space:]' | sed 's/[/?]*$//')"
          SUPABASE_ANON_KEY_CLEAN="$(printf '%s' "$SUPABASE_ANON_KEY_INPUT" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$SUPABASE_URL_CLEAN" || (echo "SUPABASE_URL secret is missing" && exit 1)
          test -n "$SUPABASE_ANON_KEY_CLEAN" || (echo "SUPABASE_ANON_KEY secret is missing" && exit 1)
          case "$SUPABASE_URL_CLEAN" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL must be the project HTTPS URL ending in .supabase.co"; exit 1 ;;
          esac
          printf 'SUPABASE_URL_CLEAN=%s\n' "$SUPABASE_URL_CLEAN" >> "$GITHUB_ENV"
          printf 'SUPABASE_ANON_KEY_CLEAN=%s\n' "$SUPABASE_ANON_KEY_CLEAN" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "$SUPABASE_URL_CLEAN/auth/v1/settings" \
            -H "apikey: $SUPABASE_ANON_KEY_CLEAN" \
            -o /dev/null
          echo "Supabase URL and public key accepted."

      - name: Generate Android and Web platform folders
        run: flutter create --project-name nexora --platforms=android,web .


      - name: Configure Firebase Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          config = Path("firebase/android/google-services.json")
          destination = Path("android/app/google-services.json")
          if not config.is_file():
              raise SystemExit("Missing firebase/android/google-services.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(config, destination)

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")
          if not settings.is_file() or not app_gradle.is_file():
              raise SystemExit("Expected Flutter Kotlin Gradle files were not generated")

          text = settings.read_text(encoding="utf-8")
          plugin_line = '    id("com.google.gms.google-services") version "4.5.0" apply false'
          if 'com.google.gms.google-services' not in text:
              match = re.search(r"plugins\s*\{", text)
              if not match:
                  raise SystemExit("Could not find plugins block in android/settings.gradle.kts")
              insert_at = match.end()
              text = text[:insert_at] + "\n" + plugin_line + text[insert_at:]
              settings.write_text(text, encoding="utf-8")

          text = app_gradle.read_text(encoding="utf-8")
          if 'id("com.google.gms.google-services")' not in text:
              match = re.search(r"plugins\s*\{", text)
              if not match:
                  raise SystemExit("Could not find plugins block in android/app/build.gradle.kts")
              insert_at = match.end()
              text = text[:insert_at] + '\n    id("com.google.gms.google-services")' + text[insert_at:]
              app_gradle.write_text(text, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permission = 'android.permission.POST_NOTIFICATIONS'
          if permission not in text:
              text = text.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application',
                  1,
              )

          marker = 'firebase_messaging_installation_id_enabled'
          if marker not in text:
              match = re.search(r"<application\b[^>]*>", text)
              if not match:
                  raise SystemExit("Could not locate Android application element")
              metadata = '\n        <meta-data android:name="firebase_messaging_installation_id_enabled" android:value="true" />'
              text = text[:match.end()] + metadata + text[match.end():]
          manifest.write_text(text, encoding="utf-8")

          if not destination.is_file() or destination.stat().st_size == 0:
              raise SystemExit("Firebase Android config copy failed")
          print("Firebase Android config and Google Services Gradle plugin configured.")
          PY

      - name: Set Android minimum SDK to 26
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          content = gradle.read_text(encoding="utf-8")
          replacements = (
              ("minSdk = flutter.minSdkVersion", "minSdk = 26"),
              ("minSdkVersion flutter.minSdkVersion", "minSdkVersion 26"),
              ("minSdk = 21", "minSdk = 26"),
              ("minSdkVersion 21", "minSdkVersion 26"),
          )
          for old, new in replacements:
              if old in content:
                  content = content.replace(old, new)
                  break
          else:
              raise SystemExit("Could not safely locate Android minSdk declaration")
          gradle.write_text(content, encoding="utf-8")
          print(f"Android minimum SDK is API 26 (Android 8.0+) in {gradle}")
          PY

      - name: Add and verify INTERNET permission in Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest not found: {manifest}")

          content = manifest.read_text(encoding="utf-8")
          permission = 'android.permission.INTERNET'
          if permission not in content:
              marker = '<application'
              if marker not in content:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              content = content.replace(
                  marker,
                  '<uses-permission android:name="android.permission.INTERNET" />' + chr(10) + '    <application',
                  1,
              )
              manifest.write_text(content, encoding="utf-8")

          verified = manifest.read_text(encoding="utf-8")
          if permission not in verified:
              raise SystemExit("INTERNET permission was not added")
          print("Verified INTERNET permission in source AndroidManifest.xml")
          PY

      - name: Add location permissions to Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permissions = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in content:
                  content = content.replace("<application", tag + "\n    <application", 1)
          manifest.write_text(content, encoding="utf-8")
          verified = manifest.read_text(encoding="utf-8")
          if any(permission not in verified for permission in permissions):
              raise SystemExit("Location permissions missing from Android manifest")
          print("Verified coarse and fine location permissions.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL_CLEAN" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY_CLEAN"

      - name: Verify INTERNET permission in release APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          if [ -n "$APKANALYZER" ]; then
            "$APKANALYZER" manifest permissions "$APK" | tee /tmp/apk-permissions.txt
            grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt
          else
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
            test -n "$AAPT"
            "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
            grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt
          fi
          echo "Verified INTERNET permission inside release APK."

      - name: Build Android App Bundle
        run: flutter build appbundle --release --dart-define=SUPABASE_URL="$SUPABASE_URL_CLEAN" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY_CLEAN"

      - name: Build Web
        run: flutter build web --release --dart-define=SUPABASE_URL="$SUPABASE_URL_CLEAN" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY_CLEAN"

      - name: Upload APK and Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/web/

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexora-latest
          name: NEXORA Latest Android Build
          body: |
            Latest automatically built NEXORA Android release.
            Download app-release.apk to install on Android.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          make_latest: true
