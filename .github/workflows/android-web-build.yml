name: NEXORA Android and Web Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Normalize and validate Supabase connection
        env:
          SUPABASE_URL_INPUT: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_INPUT: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL_CLEAN="$(printf '%s' "$SUPABASE_URL_INPUT" | tr -d '[:space:]' | sed 's/[/?]*$//')"
          SUPABASE_ANON_KEY_CLEAN="$(printf '%s' "$SUPABASE_ANON_KEY_INPUT" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$SUPABASE_URL_CLEAN" || (echo "SUPABASE_URL secret is missing" && exit 1)
          test -n "$SUPABASE_ANON_KEY_CLEAN" || (echo "SUPABASE_ANON_KEY secret is missing" && exit 1)
          case "$SUPABASE_URL_CLEAN" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL must be the project HTTPS URL ending in .supabase.co"; exit 1 ;;
          esac
          printf 'SUPABASE_URL_CLEAN=%s\n' "$SUPABASE_URL_CLEAN" >> "$GITHUB_ENV"
          printf 'SUPABASE_ANON_KEY_CLEAN=%s\n' "$SUPABASE_ANON_KEY_CLEAN" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "$SUPABASE_URL_CLEAN/auth/v1/settings" \
            -H "apikey: $SUPABASE_ANON_KEY_CLEAN" \
            -o /dev/null
          echo "Supabase URL and public key accepted."

      - name: Generate Android and Web platform folders
        run: flutter create --project-name nexora --platforms=android,web .

      - name: Add and verify INTERNET permission in Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest not found: {manifest}")

          content = manifest.read_text(encoding="utf-8")
          permission = 'android.permission.INTERNET'
          if permission not in content:
              marker = '<application'
              if marker not in content:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              content = content.replace(
                  marker,
                  '<uses-permission android:name="android.permission.INTERNET" />\\n    <application',
                  1,
              )
              manifest.write_text(content, encoding="utf-8")

          verified = manifest.read_text(encoding="utf-8")
          if permission not in verified:
              raise SystemExit("INTERNET permission was not added")
          print("Verified INTERNET permission in source AndroidManifest.xml")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL_CLEAN" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY_CLEAN"

      - name: Verify INTERNET permission in release APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          if [ -n "$APKANALYZER" ]; then
            "$APKANALYZER" manifest permissions "$APK" | tee /tmp/apk-permissions.txt
            grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt
          else
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
            test -n "$AAPT"
            "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
            grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt
          fi
          echo "Verified INTERNET permission inside release APK."

      - name: Build Web
        run: flutter build web --release --dart-define=SUPABASE_URL="$SUPABASE_URL_CLEAN" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY_CLEAN"

      - name: Upload APK and Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/
