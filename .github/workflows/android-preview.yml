name: NEXORA Android Preview APK

on:
  workflow_dispatch:
    inputs:
      confirm_source_complete:
        description: "Confirm source, configuration, and security review are complete and approve a debug APK build"
        required: true
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: nexora-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    if: inputs.confirm_source_complete == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Generate Android platform when absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name nexora .
          fi

      - name: Add Firebase Android app configuration
        shell: bash
        run: |
          if [ -f firebase/android/google-services.json ]; then
            mkdir -p android/app
            cp firebase/android/google-services.json android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
