name: NEXORA Android Preview APK

on:
  push:
    branches:
      - docs/specs-i-j-k
  workflow_dispatch:
    inputs:
      confirm_source_complete:
        description: "Confirm source, configuration, and security review are complete and approve a debug APK build"
        required: true
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: nexora-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    if: github.event_name == 'push' || inputs.confirm_source_complete == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Generate Android platform when absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name nexora .
          fi

      - name: Add Firebase Android app configuration
        shell: bash
        run: |
          if [ -f firebase/android/google-services.json ]; then
            mkdir -p android/app
            cp firebase/android/google-services.json android/app/google-services.json
          fi

      - name: Configure Firebase Android Gradle plugin
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          config = Path("android/app/google-services.json")
          if not settings.is_file() or not app.is_file() or not config.is_file():
              raise SystemExit("Generated Android Gradle files or google-services.json are missing.")

          settings_text = settings.read_text()
          settings_marker = 'plugins {\n    id("dev.flutter.flutter-plugin-loader")'
          settings_plugin = 'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false\n    id("dev.flutter.flutter-plugin-loader")'
          if 'id("com.google.gms.google-services") version "4.5.0" apply false' not in settings_text:
              if settings_marker not in settings_text:
                  raise SystemExit("Could not find the expected Flutter settings Gradle plugin block.")
              settings_text = settings_text.replace(settings_marker, settings_plugin, 1)
              settings.write_text(settings_text)

          app_text = app.read_text()
          app_marker = 'plugins {\n    id("com.android.application")'
          app_plugin = 'plugins {\n    id("com.android.application")\n    id("com.google.gms.google-services")'
          if 'id("com.google.gms.google-services")' not in app_text:
              if app_marker not in app_text:
                  raise SystemExit("Could not find the expected Android app Gradle plugin block.")
              app_text = app_text.replace(app_marker, app_plugin, 1)
              app.write_text(app_text)

          firebase = json.loads(config.read_text())
          configured = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in firebase.get("client", [])
          }
          match = re.search(r'applicationId\s*=\s*"([^"]+)"', app_text)
          if not match or match.group(1) not in configured:
              raise SystemExit(
                  f"Firebase package mismatch: app={match.group(1) if match else None}, "
                  f"configured={sorted(x for x in configured if x)}"
              )
          print("Google Services plugin applied and Firebase package ID verified.")
          PY

      - name: Declare Android runtime permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit("Generated AndroidManifest.xml is missing.")
          source = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          missing = [item for item in permissions if item not in source]
          if missing:
              anchor = "    <application"
              if anchor not in source:
                  raise SystemExit("Could not find the Android application manifest element.")
              source = source.replace(anchor, "\n".join(missing) + "\n" + anchor, 1)
              manifest.write_text(source)
          print("Location and Android 13+ notification permissions are declared.")
          PY

      - name: Configure NEXORA authentication deep link
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          activity = re.search(r'<activity\b(?=[^>]*android:name="[^"]*MainActivity")[^>]*>.*?</activity>', source, re.S)
          if not activity:
              raise SystemExit("Could not locate the generated MainActivity manifest entry.")
          block = activity.group(0)
          if 'android:launchMode="singleTop"' not in block:
              block = re.sub(r'<activity\b', '<activity android:launchMode="singleTop"', block, count=1)
          if 'android:scheme="nexora"' not in block:
              intent_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="nexora" android:host="auth-callback" />
                  </intent-filter>'''
              block = block.replace('</activity>', intent_filter + '\\n            </activity>')
          source = source[:activity.start()] + block + source[activity.end():]
          manifest.write_text(source)
          print("Registered nexora://auth-callback/ for Supabase email confirmation and recovery.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
