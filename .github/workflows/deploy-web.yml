name: Deploy NEXORA Web to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform files
        run: flutter create --project-name nexora --platforms=web .

      - name: Normalize and validate Supabase connection
        env:
          SUPABASE_URL_INPUT: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_INPUT: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL_CLEAN="$(printf '%s' "$SUPABASE_URL_INPUT" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SUPABASE_ANON_KEY_CLEAN="$(printf '%s' "$SUPABASE_ANON_KEY_INPUT" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$SUPABASE_URL_CLEAN" || (echo "SUPABASE_URL secret is missing" && exit 1)
          test -n "$SUPABASE_ANON_KEY_CLEAN" || (echo "SUPABASE_ANON_KEY secret is missing" && exit 1)
          case "$SUPABASE_URL_CLEAN" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL must be the project HTTPS URL ending in .supabase.co"; exit 1 ;;
          esac
          printf 'SUPABASE_URL_CLEAN=%s\n' "$SUPABASE_URL_CLEAN" >> "$GITHUB_ENV"
          printf 'SUPABASE_ANON_KEY_CLEAN=%s\n' "$SUPABASE_ANON_KEY_CLEAN" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "$SUPABASE_URL_CLEAN/auth/v1/settings" \
            -H "apikey: $SUPABASE_ANON_KEY_CLEAN" -o /dev/null

      - name: Prepare GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Determine Pages availability
        id: pages_check
        run: echo "enabled=${{ steps.pages.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href /nexora/ --dart-define=SUPABASE_URL="$SUPABASE_URL_CLEAN" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY_CLEAN"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
